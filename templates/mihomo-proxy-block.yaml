# Drop-in replacement for the `proxies:` entry in an existing mihomo / Clash Verge
# profile. Change ONLY these fields in the user's own template; keep their DNS, TUN,
# groups and rules byte-identical — they chose those deliberately.
#
# The name appears twice: here and in every proxy-group that lists it.
proxies:
  - name: "<NODE_NAME>"
    type: vless
    server: <SERVER_IP>
    port: 443
    uuid: <UUID>
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: <SNI>
    client-fingerprint: chrome
    reality-opts:
      public-key: <PUBLIC_KEY>
      short-id: <SHORT_ID>
